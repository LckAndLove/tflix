<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TFLIX — Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/icons/icon_16.png" sizes="16x16">
  <link rel="icon" href="../assets/icons/icon_32.png" sizes="32x32">
  <link rel="icon" href="../assets/icons/icon_48.png" sizes="48x48">
  <link rel="icon" href="../assets/icons/icon_64.png" sizes="64x64">
  <link rel="icon" href="../assets/icons/icon_128.png" sizes="128x128">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#000; --bg-elev:#181818; --card:#242424; --card-h:#303030; --line:#383838; --accent:#e50914; --accent-h:#ff2632; --accent-soft:#351115; --text:#f5f5f1; --muted:#aaa; --green:#62c98b; --shadow:0 12px 48px #0009; --radius:4px; --radius-lg:6px; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; color:var(--text); font-family:Arial,'Hanken Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    button,select { font:inherit; }
    button,a,select { -webkit-tap-highlight-color:transparent; }
    button,a { color:inherit; }
    button { cursor:pointer; }
    a { text-decoration:none; }
    [hidden] { display:none !important; }
    :focus-visible { outline:2px solid #fff; outline-offset:4px; }
    header { height:60px; display:flex; align-items:center; gap:18px; padding:0 24px; background:#101010; position:relative; z-index:50; }
    .back-btn { width:32px; height:36px; display:grid; place-items:center; flex-shrink:0; color:#fff; background:none; border:0; }
    .back-btn:hover { opacity:.7; }
    .logo { color:var(--accent); font-size:17px; font-weight:800; letter-spacing:-.06em; cursor:pointer; flex-shrink:0; }
    .now-title { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:15px; font-weight:600; }
    .ep-tag { color:var(--muted); font-size:13px; font-weight:400; margin-left:8px; }
    .watch-action,.support-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:36px; padding:6px 10px; background:transparent; border:0; border-radius:3px; color:#ddd; font-size:13px; white-space:nowrap; }
    .watch-action:hover,.support-btn:hover,.watch-action[aria-expanded="true"] { background:#ffffff18; color:#fff; }
    .watch-action[aria-expanded="true"] { box-shadow:inset 0 -2px var(--accent); }
    .source-indicator { width:6px; height:6px; border-radius:50%; background:#777; }
    #sources-btn[data-state="playing"] .source-indicator,#sources-btn[data-state="available"] .source-indicator { background:var(--green); }
    #sources-btn[data-state="checking"] .source-indicator,#sources-btn[data-state="switching"] .source-indicator { background:#e7b65b; }
    #sources-btn[data-state="failed"] .source-indicator { background:#ff7070; }
    .current-source { color:#999; font-size:12px; }
    #support-btn { display:none; }
    main { height:calc(100vh - 60px); height:calc(100dvh - 60px); position:relative; }
    .player-col,.player-wrap { width:100%; height:100%; }
    .player-wrap { position:relative; background:#000; }
    #player { position:absolute; inset:0; width:100%; height:100%; border:0; }
    #player:fullscreen,#player:-webkit-full-screen { position:fixed; width:100vw; height:100vh; }
    .player-loading { position:absolute; inset:0; display:grid; place-items:center; background:#000; z-index:1; pointer-events:none; transition:opacity .4s; }
    .player-loading.hide { opacity:0; }
    .spinner { width:38px; height:38px; border:3px solid #333; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .drawer-scrim { position:fixed; inset:60px 0 0; z-index:55; background:#0003; border:0; cursor:default; }
    .controls-col { position:absolute; top:12px; right:20px; width:min(400px,calc(100% - 40px)); max-height:calc(100% - 32px); overflow:auto; z-index:60; background:#181818; border:1px solid #353535; border-radius:6px; box-shadow:var(--shadow); }
    .drawer-header { display:flex; align-items:center; justify-content:space-between; padding:20px 22px 0; gap:16px; }
    .drawer-header h2 { font-size:20px; font-weight:600; }
    .drawer-close { padding:6px 0 6px 12px; background:none; border:0; color:#bbb; font-size:12px; }
    .drawer-close:hover { color:#fff; }
    .panel { padding:22px; }
    .panel-title { font-size:13px; color:#aaa; margin-bottom:14px; }
    .controls-col[data-panel="sources"] #tv-panel,.controls-col[data-panel="episodes"] #servers-panel { display:none; }
    .controls-col[data-panel="sources"] .panel-title { display:none; }
    .selectors { display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:24px; }
    .field-label { display:block; color:#aaa; font-size:12px; margin-bottom:8px; }
    .sel { width:100%; min-height:44px; padding:10px 12px; background:#252525; color:#fff; border:1px solid #555; border-radius:3px; font-size:14px; cursor:pointer; }
    .sel option { color:#fff; background:#252525; }
    .nextep-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px; background:#fff; color:#111; font-size:14px; font-weight:600; border:0; border-radius:3px; }
    .nextep-btn:hover:not(:disabled) { background:#ddd; }
    .nextep-btn:disabled { opacity:.4; cursor:default; }
    .source-health { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:20px; }
    .source-health-copy { display:flex; align-items:baseline; gap:8px; color:#aaa; font-size:12px; line-height:1.6; }
    .source-health[data-state="playing"] .source-health-copy,.source-health[data-state="available"] .source-health-copy { color:var(--green); }
    .source-health[data-state="failed"] .source-health-copy { color:#ff8a8a; }
    .source-health-dot { width:5px; height:5px; flex:0 0 auto; border-radius:50%; background:currentColor; }
    .retry-source-btn { flex-shrink:0; padding:5px 8px; background:none; border:1px solid #666; border-radius:3px; color:#ddd; font-size:11px; }
    .retry-source-btn:hover { border-color:#fff; }
    .server-grid { display:grid; grid-template-columns:1fr; gap:0; }
    .server-card { display:grid; grid-template-columns:6px minmax(0,1fr); gap:12px; align-items:center; min-height:66px; width:100%; padding:14px 10px; background:none; border:0; border-bottom:1px solid #ffffff12; text-align:left; color:#ddd; }
    .server-card:last-child { border-bottom:0; }
    .server-card:hover { background:#ffffff09; }
    .server-card.selected { background:#ffffff0c; color:#fff; box-shadow:inset 2px 0 var(--accent); }
    .s-dot { width:5px; height:5px; border-radius:50%; background:#777; }
    .s-meta { display:grid; grid-template-columns:1fr auto; gap:5px 8px; align-items:center; min-width:0; }
    .s-name { font-size:14px; font-weight:600; }
    .s-note { grid-column:1/-1; font-size:11px; color:#999; line-height:1.5; }
    .s-state { font-size:10px; color:#999; }
    .server-card[data-status="playing"] .s-dot,.server-card[data-status="available"] .s-dot { background:var(--green); }
    .server-card[data-status="playing"] .s-state,.server-card[data-status="available"] .s-state { color:var(--green); }
    .server-card[data-status="checking"] .s-dot { background:#e7b65b; }
    .server-card[data-status="failed"] .s-state { color:#ff8a8a; }
    #toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); max-width:90%; padding:10px 18px; border-radius:3px; background:#252525ee; color:#fff; font-size:13px; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s; }
    #toast.show { opacity:1; }
    .fatal { display:grid; place-content:center; height:100%; text-align:center; gap:16px; padding:24px; color:#aaa; }
    .fatal h2 { color:#fff; font-size:24px; }
    .fatal a { color:#fff; text-decoration:underline; }
    html.keynav .kf { outline:2px solid #fff; outline-offset:2px; }
    @media (max-width:700px) { header { padding:0 12px; gap:8px; height:56px; } main { height:calc(100vh - 56px); height:calc(100dvh - 56px); } .logo { display:none; } .now-title { font-size:13px; } .ep-tag { display:none; } .watch-action { padding:6px 8px; font-size:12px; } .current-source { display:none; } .support-btn { padding:6px; } .drawer-scrim { top:56px; } .controls-col { right:12px; width:min(380px,calc(100% - 24px)); } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="back-btn" title="Back" aria-label="Back">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="logo" id="logo">TFLIX</div>
    <div class="now-title" id="now-title">Loading…</div>
    <button class="watch-action" id="episodes-btn" type="button" aria-controls="watch-drawer" aria-expanded="false" aria-haspopup="dialog"><span id="episodes-label">Episodes</span></button>
    <button class="watch-action" id="sources-btn" type="button" aria-controls="watch-drawer" aria-expanded="false" aria-haspopup="dialog"><span class="source-indicator" aria-hidden="true"></span><span id="sources-label">Sources</span><span class="current-source" id="current-source"></span></button>
    <button class="support-btn" id="lang-btn" title="Language / 语言" aria-label="Language / 语言" style="cursor:pointer;">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span class="s-name" id="lang-label">EN</span>
    </button>
    <a class="support-btn" id="support-btn" href="https://github.com/LckAndLove/tflix" target="_blank" rel="noopener noreferrer" title="View repository or report an issue on GitHub">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span class="s-name">Support</span>
    </a>
  </header>

  <main id="main">
    <div class="player-col">
      <div class="player-wrap" id="player-wrap">
        <div class="player-loading" id="player-loading"><div class="spinner"></div></div>
        <iframe id="player" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allowfullscreen allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; web-share *"></iframe>
      </div>
    </div>

    <button class="drawer-scrim" id="drawer-scrim" type="button" tabindex="-1" aria-label="Close" hidden></button>
    <aside class="controls-col" id="watch-drawer" data-panel="sources" role="dialog" aria-labelledby="drawer-title" hidden>
      <div class="drawer-header"><h2 id="drawer-title">Sources</h2><button class="drawer-close" id="drawer-close" type="button">Close</button></div>
      <div class="panel" id="tv-panel" hidden>
        <div class="selectors">
          <div>
            <label class="field-label" for="season-select">Season</label>
            <select id="season-select" class="sel"></select>
          </div>
          <div>
            <label class="field-label" for="episode-select">Episode</label>
            <select id="episode-select" class="sel"></select>
          </div>
        </div>
        <button class="nextep-btn" id="nextep-btn">
          <span>Next Episode</span>
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M4 5v14l11-7zM18 5h2v14h-2z"/></svg>
        </button>
      </div>

      <div class="panel" id="servers-panel">
        <div class="panel-title">Streaming Servers</div>
        <div class="source-health" id="source-health" data-state="checking" role="status" aria-live="polite">
          <div class="source-health-copy"><span class="source-health-dot"></span><span id="source-health-text">Checking source…</span></div>
          <button class="retry-source-btn" id="retry-source-btn" type="button">Auto try</button>
        </div>
        <div class="server-grid" id="server-grid"></div>
      </div>
    </aside>
  </main>

  <div id="toast"></div>

<script>
/* ─── CONFIG ─── */
const API_BASE = "https://api.themoviedb.org/3";
const HEADERS = {
  // Same TMDB token placeholder as the main TFLIX index.html.
  // Make sure your deploy step injects __TMDB_TOKEN__ into this file too,
  // or paste your read token here directly.
  'Authorization': 'Bearer __TMDB_TOKEN__',
  'accept': 'application/json'
};

const STORAGE_KEY = 'tflix_server';
const LANG_STORAGE_KEY = 'tflix_lang';

const I18N = {
  en: {
    episodes: 'Episodes', sources: 'Sources', close: 'Close',
    langShort: 'EN',
    back: 'Back',
    support: 'Support',
    serversHeader: 'Streaming Servers',
    nowStreaming: 'Now streaming from %s',
    season: 'Season',
    episode: 'Episode',
    nextEp: 'Next Episode',
    nextEpTitle: 'Next: S%s E%s',
    noNextEp: 'No next episode',
    sourceManual: 'Automatic detection is unavailable here · select a source manually',
    sourceSelectedLabel: 'Selected',
    sourceChecking: 'Loading %s · waiting up to 90 seconds…',
    sourceReady: 'Video found on %s · waiting to play',
    sourcePlaying: 'Playing on %s',
    sourceError: '%s encountered a playback error · trying another source',
    sourceSwitching: '%s did not start · trying %s',
    sourceNotFound: 'No source started · tried all servers',
    sourceRetry: 'Auto try',
    sourceStop: 'Stop trying',
    sourceStopped: 'Automatic switching stopped · keeping %s',
    sourceRecovering: '%s encountered an error · waiting 12 seconds for recovery',
    sourceCheckingLabel: 'Checking',
    sourceReadyLabel: 'Video found',
    sourcePlayingLabel: 'Playing',
    sourceFailedLabel: 'No video',
    sourceUntestedLabel: 'Not checked',
    loading: 'Loading…',
    movieFallback: 'Movie',
    seriesFallback: 'Series',
    fatalTitle: 'Title not found',
    fatalDesc: 'This title does not exist or could not be loaded.',
    fatalLink: 'Back to TFLIX',
    nothingTitle: 'Nothing to play',
    nothingDesc: 'This link is missing the title information.',
    switchedToast: 'Switched to English'
  },
  zh: {
    episodes: '选集', sources: '播放源', close: '关闭',
    langShort: '中',
    back: '返回',
    support: '技术支持',
    serversHeader: '播放源服务器',
    nowStreaming: '正在从 %s 播放',
    season: '季',
    episode: '集',
    nextEp: '下一集',
    nextEpTitle: '下一集：第 %s 季 第 %s 集',
    noNextEp: '没有下一集',
    sourceManual: '当前平台暂不支持自动检测，请手动选择播放源',
    sourceSelectedLabel: '已选择',
    sourceChecking: '正在加载 %s，最多等待 90 秒…',
    sourceReady: '%s 找到视频 · 等待开始播放',
    sourcePlaying: '正在播放 · %s',
    sourceError: '%s 播放解码失败，正在尝试其他源',
    sourceSwitching: '%s 没有开始播放，正在尝试 %s',
    sourceNotFound: '已尝试全部播放源，暂未找到可播放视频',
    sourceRetry: '自动试源',
    sourceStop: '停止试源',
    sourceStopped: '已停止自动切源，保留 %s',
    sourceRecovering: '%s 出现异常，等待 12 秒尝试恢复',
    sourceCheckingLabel: '检测中',
    sourceReadyLabel: '找到视频',
    sourcePlayingLabel: '正在播放',
    sourceFailedLabel: '未出画面',
    sourceUntestedLabel: '尚未检测',
    loading: '加载中…',
    movieFallback: '电影',
    seriesFallback: '电视剧',
    fatalTitle: '未找到影视内容',
    fatalDesc: '该影视内容不存在或加载失败。',
    fatalLink: '返回 TFLIX 首页',
    nothingTitle: '暂无播放内容',
    nothingDesc: '该链接缺少影视编号信息。',
    switchedToast: '已切换为简体中文'
  }
};

let currentLang = (() => {
  const saved = localStorage.getItem(LANG_STORAGE_KEY);
  if (saved && (saved === 'zh' || saved === 'en')) return saved;
  return (navigator.language && navigator.language.toLowerCase().indexOf('zh') === 0) ? 'zh' : 'en';
})();

const t = key => (I18N[currentLang] && I18N[currentLang][key]) || (I18N.en && I18N.en[key]) || key;

const SERVERS = [
  { id: 1, name: 'Rakan',   noteEn: 'Generally better quality.', noteZh: '画质普遍较好。' },
  { id: 2, name: 'Bard',    noteEn: 'Recommended for recently released movies.', noteZh: '推荐用于最新上映的电影。' },
  { id: 3, name: 'Xayah',   noteEn: 'Recommended for recently released movies.', noteZh: '推荐用于最新上映的电影。' },
  { id: 4, name: 'Ekko',    noteEn: 'May have 4K. Generally better quality.', noteZh: '可能支持 4K，画质普遍较好。' },
  { id: 5, name: 'Naafiri', noteEn: 'May have 4K. Generally better quality.', noteZh: '可能支持 4K，画质普遍较好。' },
  { id: 6, name: 'Ryze',    noteEn: 'Generally better quality.', noteZh: '画质普遍较好。' },
];

/* Exact streaming source resolvers (ported from the original player) */
const serverUrlResolvers = {
  //1: (p) => p.type === 'movie' ? `https://vidsrc.cc/v2/embed/movie/${p.id}?autoPlay=false` : `https://vidsrc.cc/v2/embed/tv/${p.id}/${p.season}/${p.episode}?autoPlay=false`, // Rakan (vidsrc.cc)
  1: (p) => p.type === 'movie' ? `https://vixsrc.to/movie/${p.id}?autoPlay=true&lang=en` : `https://vixsrc.to/tv/${p.id}/${p.season}/${p.episode}?autoPlay=true&lang=en`,                                   // Rakan
  2: (p) => p.type === 'movie' ? `https://moviesapi.to/movie/${p.id}` : `https://moviesapi.to/tv/${p.id}-${p.season}-${p.episode}`,                                                                            // Bard
  3: (p) => p.type === 'movie' ? `https://vidsrc.sh/embed/movie?tmdb=${p.id}&autoplay=1` : `https://vidsrc.sh/embed/tv?tmdb=${p.id}&season=${p.season}&episode=${p.episode}&autoplay=1&autonext=1`,                        // Xayah
  4: (p) => p.type === 'movie' ? `https://cinesrc.st/embed/movie/${p.id}?autoplay=true&prioritize=true&lastserver=wave` : `https://cinesrc.st/embed/tv/${p.id}?s=${p.season}&e=${p.episode}&autoplay=true&autonext=true&prioritize=true&lastserver=wave`, // Ekko
  5: (p) => p.type === 'movie' ? `https://vidfast.vc/movie/${p.id}?autoPlay=true` : `https://vidfast.vc/tv/${p.id}/${p.season}/${p.episode}?autoPlay=true`,                                                   // Naafiri
  6: (p) => p.type === 'movie' ? `https://vidlink.pro/movie/${p.id}?title=true&poster=true&autoplay=true` : `https://vidlink.pro/tv/${p.id}/${p.season}/${p.episode}?title=true&poster=true&autoplay=true&nextbutton=true` // Ryze
};

const AUTO_SOURCE_ORDER = [4, 5, 6, 1, 2, 3];
const SOURCE_CHECK_TIMEOUT_MS = 90000;
const SOURCE_RECOVERY_TIMEOUT_MS = 12000;

/* ─── STATE ─── */
const $ = id => document.getElementById(id);
const tmdb = async path => {
  const sep = path.includes('?') ? '&' : '?';
  const lang = currentLang === 'zh' ? 'zh-CN' : 'en-US';
  const r = await fetch(`${API_BASE}${path}${sep}language=${lang}`, { headers: HEADERS });
  if (!r.ok) throw new Error('TMDB request failed');
  return r.json();
};

let state = null;          // { type, id, season, episode, server, title }
let tvData = null;         // /tv/{id} details
const seasonCache = {};    // cached season episode lists
let sourceStatuses = {};
let sourceSequence = [];
let sourceSequenceIndex = 0;
let sourceCheckTimer = null;
let playerMediaDetected = false;
let autoTryEnabled = Boolean(window.__TFLIX_PLAYER_ORIGIN__);
let sourceRecoveryTimer = null;

/* ─── PARAMS ─── */
function readParams() {
  const p = new URLSearchParams(location.search);
  const type = p.get('type');
  const id = p.get('id');
  if (!id || (type !== 'movie' && type !== 'tv')) return null;

  let server = parseInt(p.get('server'), 10);
  if (!server || !serverUrlResolvers[server]) {
    const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    server = (saved && serverUrlResolvers[saved]) ? saved : 4;
  }

  const out = { type, id, server };
  if (type === 'tv') {
    out.season  = parseInt(p.get('s'), 10) || 1;
    out.episode = parseInt(p.get('e'), 10) || 1;
  }
  return out;
}

function syncUrl() {
  const p = new URLSearchParams();
  p.set('type', state.type);
  p.set('id', state.id);
  if (state.type === 'tv') { p.set('s', state.season); p.set('e', state.episode); }
  p.set('server', state.server);
  history.replaceState(null, '', `${location.pathname}?${p.toString()}`);
}

/* ─── PLAYER ─── */
function loadPlayer(continueAutoTry = false) {
  clearTimeout(sourceRecoveryTimer);
  sourceRecoveryTimer = null;
  const src = serverUrlResolvers[state.server](state);
  const loader = $('player-loading');
  loader.classList.remove('hide');

  if (!continueAutoTry) {
    clearTimeout(sourceCheckTimer);
    sourceStatuses = {};
    sourceSequence = [state.server, ...AUTO_SOURCE_ORDER.filter(id => id !== state.server)];
    sourceSequenceIndex = 0;
    playerMediaDetected = false;
  }
  playerMediaDetected = false;
  const canDetect = Boolean(window.__TFLIX_PLAYER_ORIGIN__);
  $('retry-source-btn').hidden = !canDetect;
  sourceStatuses[state.server] = canDetect ? 'checking' : 'selected';
  updateSourceStatus(canDetect ? 'checking' : 'manual', canDetect
    ? t(autoTryEnabled ? 'sourceChecking' : 'sourceStopped').replace('%s', serverName(state.server)) : t('sourceManual'));
  updateServerCards();

  // Recreate the iframe on every load so the Permissions Policy
  // (allow="fullscreen; ...") is re-applied for the new origin.
  // Navigating an existing iframe via contentWindow.location drops the
  // fullscreen delegation for cross-origin servers, which is why fullscreen
  // only worked for the first/Rakan server before.
  const old = $('player');
  const frame = document.createElement('iframe');
  frame.id = 'player';
  // Keep third-party frames from replacing the app or opening popups.
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
  frame.allowFullscreen = true;
  // Use "*" so the fullscreen permission cascades to nested cross-origin
  // iframes (Xayah / Ekko load the real player inside a second iframe).
  frame.setAttribute('allow', 'autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; web-share *');
  frame.referrerPolicy = 'origin';
  frame.onload = () => loader.classList.add('hide');
  // Use replace so iframe loads don't pollute the browser history stack
  // Desktop custom protocols cannot send an HTTP Referer to embed providers.
  // The loopback wrapper supplies one without moving the app or its storage.
  frame.src = window.__TFLIX_PLAYER_ORIGIN__
    ? `${window.__TFLIX_PLAYER_ORIGIN__}?src=${encodeURIComponent(src)}`
    : src;
  old.replaceWith(frame);

  clearTimeout(sourceCheckTimer);
  if (window.__TFLIX_PLAYER_ORIGIN__ && autoTryEnabled) {
    sourceCheckTimer = setTimeout(() => {
      if (!playerMediaDetected) tryNextSource();
    }, SOURCE_CHECK_TIMEOUT_MS);
  }

  setTimeout(() => loader.classList.add('hide'), 4000); // fail-safe
  syncUrl();
  if (state.title) updateTitleBar();
}

function serverName(id) { return SERVERS.find(server => server.id === id)?.name || `#${id}`; }

function updateSourceStatus(status, message) {
  const region = $('source-health');
  const label = $('source-health-text');
  if (!region || !label) return;
  region.dataset.state = status;
  $('sources-btn').dataset.state = status;
  $('sources-btn').title = message;
  $('current-source').textContent = serverName(state.server);
  label.textContent = message;
  $('retry-source-btn').textContent = t(autoTryEnabled ? 'sourceStop' : 'sourceRetry');
}

function updateServerCards() {
  document.querySelectorAll('.server-card').forEach(card => {
    const id = Number(card.dataset.id);
    const status = sourceStatuses[id] || 'unknown';
    card.dataset.status = status;
    const label = card.querySelector('.s-state');
    if (!label) return;
    const labels = {
      selected: t('sourceSelectedLabel'),
      unknown: t('sourceUntestedLabel'),
      checking: t('sourceCheckingLabel'),
      available: t('sourceReadyLabel'),
      playing: t('sourcePlayingLabel'),
      failed: t('sourceFailedLabel')
    };
    label.textContent = labels[status];
  });
}

function tryNextSource() {
  if (!state || playerMediaDetected || !autoTryEnabled) return;
  clearTimeout(sourceCheckTimer);
  sourceStatuses[state.server] = 'failed';
  sourceSequenceIndex += 1;
  const next = sourceSequence[sourceSequenceIndex];
  if (!next) {
    updateServerCards();
    updateSourceStatus('failed', t('sourceNotFound'));
    return;
  }
  const previous = serverName(state.server);
  state.server = next;
  document.querySelectorAll('.server-card').forEach(card => card.classList.toggle('selected', Number(card.dataset.id) === next));
  updateServerCards();
  updateSourceStatus('switching', t('sourceSwitching').replace('%s', previous).replace('%s', serverName(next)));
  toast(t('sourceSwitching').replace('%s', previous).replace('%s', serverName(next)));
  loadPlayer(true);
}

function onPlayerMediaEvent(event) {
  if (!event.data || !['tflix:media-ready', 'tflix:media-playing', 'tflix:media-error'].includes(event.data.type)) return;
  if (!isCurrentPlayerFrame(event.source)) return;
  if (event.data.type === 'tflix:media-error') {
    if (!autoTryEnabled || sourceRecoveryTimer) return;
    const failedServer = state.server;
    // Early error placeholders must not shorten the initial loading window.
    if (!playerMediaDetected) return;
    clearTimeout(sourceCheckTimer);
    updateSourceStatus('switching', t('sourceRecovering').replace('%s', serverName(failedServer)));
    sourceRecoveryTimer = setTimeout(() => {
      sourceRecoveryTimer = null;
      if (state.server !== failedServer || !autoTryEnabled) return;
      playerMediaDetected = false;
      tryNextSource();
    }, SOURCE_RECOVERY_TIMEOUT_MS);
    return;
  }
  clearTimeout(sourceRecoveryTimer);
  sourceRecoveryTimer = null;
  const playing = event.data.type === 'tflix:media-playing';
  // A playable video may require a user gesture. Do not switch it away.
  clearTimeout(sourceCheckTimer);
  if (sourceStatuses[state.server] === 'playing' && !playing) return;
  playerMediaDetected = true;
  sourceStatuses[state.server] = playing ? 'playing' : 'available';
  updateServerCards();
  updateSourceStatus(playing ? 'playing' : 'available', t(playing ? 'sourcePlaying' : 'sourceReady').replace('%s', serverName(state.server)));
}

function isCurrentPlayerFrame(source) {
  const root = $('player')?.contentWindow;
  if (!root) return false;
  const pending = [root];
  const visited = new Set();
  while (pending.length) {
    const frame = pending.pop();
    if (frame === source) return true;
    if (!frame || visited.has(frame)) continue;
    visited.add(frame);
    try {
      for (let i = 0; i < frame.frames.length; i++) pending.push(frame.frames[i]);
    } catch {}
  }
  return false;
}

window.addEventListener('message', onPlayerMediaEvent);
$('retry-source-btn').addEventListener('click', () => {
  autoTryEnabled = !autoTryEnabled;
  clearTimeout(sourceCheckTimer);
  clearTimeout(sourceRecoveryTimer);
  sourceRecoveryTimer = null;
  if (autoTryEnabled) loadPlayer();
  else updateSourceStatus('manual', t('sourceStopped').replace('%s', serverName(state.server)));
});

function updateTitleBar() {
  const base = state.title || (state.type === 'movie' ? t('movieFallback') : t('seriesFallback'));
  const epTag = currentLang === 'zh'
    ? ` <span class="ep-tag">· 第 ${state.season} 季 第 ${state.episode} 集</span>`
    : ` <span class="ep-tag">· S${state.season} E${state.episode}</span>`;
  $('now-title').innerHTML = state.type === 'tv'
    ? `${esc(base)}${epTag}`
    : esc(base);
  document.title = `${base} — TFLIX`;
}

/* ─── SERVERS ─── */
function buildServers() {
  const grid = $('server-grid');
  grid.innerHTML = '';
  SERVERS.forEach(s => {
    const el = document.createElement('button');
    el.className = 'server-card' + (s.id === state.server ? ' selected' : '');
    el.dataset.id = s.id;
    const note = currentLang === 'zh' ? s.noteZh : s.noteEn;
    el.innerHTML = `
      <span class="s-dot"></span>
      <span class="s-meta">
        <span class="s-name">${esc(s.name)}</span>
        <span class="s-state"></span>
        <span class="s-note">${esc(note)}</span>
      </span>`;
    el.addEventListener('click', () => {
      if (s.id === state.server) return;
      autoTryEnabled = false;
      state.server = s.id;
      document.querySelectorAll('.server-card').forEach(c => c.classList.toggle('selected', c === el));
      loadPlayer();
      toast(t('nowStreaming').replace('%s', s.name));
    });
    grid.appendChild(el);
  });
  updateServerCards();
}

function applyTranslations() {
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  $('lang-label').textContent = t('langShort');
  $('episodes-label').textContent = t('episodes');
  $('sources-label').textContent = t('sources');
  $('drawer-close').textContent = t('close');
  $('drawer-scrim').setAttribute('aria-label',t('close'));
  $('drawer-title').textContent = t($('watch-drawer').dataset.panel === 'episodes' ? 'episodes' : 'sources');
  $('episodes-btn').hidden = state?.type !== 'tv';
  $('back-btn').title = t('back');
  $('back-btn').setAttribute('aria-label', t('back'));
  const supText = $('support-btn')?.querySelector('.s-name');
  if (supText) supText.textContent = t('support');
  const srvHeader = document.querySelector('#servers-panel .panel-title');
  if (srvHeader) srvHeader.textContent = t('serversHeader');
  const selLabels = document.querySelectorAll('.selectors .field-label');
  if (selLabels[0]) selLabels[0].textContent = t('season');
  if (selLabels[1]) selLabels[1].textContent = t('episode');
  const nextSpan = $('nextep-btn')?.querySelector('span');
  if (nextSpan) nextSpan.textContent = t('nextEp');
  if (state) {
    updateNextBtn();
    buildServers();
  }
}

async function changeLanguage(newLang) {
  if (newLang === currentLang) return;
  currentLang = newLang;
  localStorage.setItem(LANG_STORAGE_KEY, newLang);
  applyTranslations();
  toast(t('switchedToast'));

  // Re-fetch title and details with new language
  if (state.type === 'tv') {
    try {
      tvData = await tmdb(`/tv/${state.id}`);
      state.title = tvData.name || tvData.original_name;
      updateTitleBar();
      for (const k in seasonCache) delete seasonCache[k];
      const seasonSel = $('season-select');
      const seasons = (tvData.seasons || []).filter(s => s.season_number > 0);
      const sWord = t('season');
      const epWord = currentLang === 'zh' ? '集' : 'ep';
      seasonSel.innerHTML = (seasons.length ? seasons : [{ season_number: 1, episode_count: 1 }])
        .map(s => `<option value="${s.season_number}" data-eps="${s.episode_count}">${sWord} ${s.season_number} · ${s.episode_count} ${epWord}</option>`)
        .join('');
      seasonSel.value = state.season;
      await populateEpisodes(true);
    } catch {}
  } else {
    try {
      const data = await tmdb(`/movie/${state.id}`);
      state.title = data.title || data.original_title;
      updateTitleBar();
    } catch {}
  }
}

$('lang-btn').addEventListener('click', () => {
  changeLanguage(currentLang === 'zh' ? 'en' : 'zh');
});

$('support-btn')?.addEventListener('click', e => {
  e.preventDefault();
  const url = 'https://github.com/LckAndLove/tflix';
  if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
    window.__TAURI__.core.invoke('open_external', { url }).catch(() => { window.location.href = url; });
  } else {
    window.open(url, '_blank', 'noopener,noreferrer');
  }
});

/* ─── TV SEASON / EPISODE ─── */
async function setupTv() {
  $('tv-panel').hidden = false;
  const seasonSel  = $('season-select');
  const episodeSel = $('episode-select');

  try {
    tvData = await tmdb(`/tv/${state.id}`);
    if (!tvData || (!tvData.name && !tvData.original_name)) throw new Error('not found');
    state.title = tvData.name || tvData.original_name;
    updateTitleBar();

    const seasons = (tvData.seasons || []).filter(s => s.season_number > 0);
    const sWord = t('season');
    const epWord = currentLang === 'zh' ? '集' : 'ep';
    seasonSel.innerHTML = (seasons.length ? seasons : [{ season_number: 1, episode_count: 1 }])
      .map(s => `<option value="${s.season_number}" data-eps="${s.episode_count}">${sWord} ${s.season_number} · ${s.episode_count} ${epWord}</option>`)
      .join('');
    seasonSel.value = state.season;
    if (!seasonSel.value) { state.season = parseInt(seasonSel.options[0].value); seasonSel.value = state.season; }
  } catch {
    showFatal();
    return;
  }

  await populateEpisodes(true);

  seasonSel.addEventListener('change', async () => {
    state.season = parseInt(seasonSel.value) || 1;
    state.episode = 1;
    await populateEpisodes(true);
    loadPlayer();
  });
  episodeSel.addEventListener('change', () => {
    state.episode = parseInt(episodeSel.value) || 1;
    loadPlayer();
  });

  $('nextep-btn').addEventListener('click', goNextEpisode);
}

async function populateEpisodes(setToState) {
  const seasonSel  = $('season-select');
  const episodeSel = $('episode-select');
  const opt = seasonSel.options[seasonSel.selectedIndex];
  const fallbackCount = parseInt(opt?.dataset?.eps || 24);

  episodeSel.innerHTML = `<option>${t('loading')}</option>`;
  const key = `${state.id}-${state.season}`;
  try {
    let data = seasonCache[key];
    if (!data) { data = await tmdb(`/tv/${state.id}/season/${state.season}`); seasonCache[key] = data; }
    const eps = data?.episodes || [];
    if (!eps.length) throw new Error('no eps');
    const epPrefix = currentLang === 'zh' ? '第 ' : 'Ep ';
    const epSuffix = currentLang === 'zh' ? ' 集' : '';
    episodeSel.innerHTML = eps.map(ep => {
      const d = fmtDate(ep.air_date);
      const name = (ep.name && ep.name !== `Episode ${ep.episode_number}` && ep.name !== `第 ${ep.episode_number} 集`) ? ` · ${ep.name}` : '';
      return `<option value="${ep.episode_number}">${epPrefix}${ep.episode_number}${epSuffix}${name}${d ? ' · ' + d : ''}</option>`;
    }).join('');
  } catch {
    episodeSel.innerHTML = Array.from({ length: fallbackCount }, (_, i) => {
      const epPrefix = currentLang === 'zh' ? `第 ${i+1} 集` : `Episode ${i+1}`;
      return `<option value="${i+1}">${epPrefix}</option>`;
    }).join('');
  }

  if (setToState) {
    if (![...episodeSel.options].some(o => parseInt(o.value) === state.episode)) state.episode = 1;
    episodeSel.value = state.episode;
  }
  updateNextBtn();
}

function episodeCountFor(seasonNum) {
  const cached = seasonCache[`${state.id}-${seasonNum}`];
  if (cached?.episodes?.length) return cached.episodes.length;
  const s = (tvData?.seasons || []).find(x => x.season_number === seasonNum);
  return s ? s.episode_count : null;
}

function computeNext() {
  const curCount = episodeCountFor(state.season);
  if (curCount && state.episode < curCount) return { season: state.season, episode: state.episode + 1 };
  const nextSeason = state.season + 1;
  const exists = (tvData?.seasons || []).some(s => s.season_number === nextSeason);
  if (exists) return { season: nextSeason, episode: 1 };
  return null;
}

function updateNextBtn() {
  const btn = $('nextep-btn');
  const next = state?.type === 'tv' ? computeNext() : null;
  btn.disabled = !next;
  btn.title = next ? t('nextEpTitle').replace('%s', next.season).replace('%s', next.episode) : t('noNextEp');
}

async function goNextEpisode() {
  const next = computeNext();
  if (!next) return;
  const seasonChanged = next.season !== state.season;
  state.season = next.season;
  state.episode = next.episode;
  if (seasonChanged) { $('season-select').value = state.season; await populateEpisodes(true); }
  else $('episode-select').value = state.episode;
  updateNextBtn();
  loadPlayer();
}

/* ─── MOVIE TITLE ─── */
async function setupMovie() {
  try {
    const data = await tmdb(`/movie/${state.id}`);
    if (!data || (!data.title && !data.original_title)) throw new Error('not found');
    state.title = data.title || data.original_title;
  } catch {
    showFatal();
    return;
  }
  updateTitleBar();
}

/* ─── UTILS ─── */
function showFatal() {
  $('main').innerHTML = `
    <div class="fatal">
      <h2>${esc(t('fatalTitle'))}</h2>
      <p>${esc(t('fatalDesc'))}</p>
      <a href="../index.html">${esc(t('fatalLink'))}</a>
    </div>`;
  document.title = 'TFLIX';
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  if (currentLang === 'zh') {
    return dt.toLocaleDateString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric' });
  }
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function toast(msg){
  const t = $('toast');
  t.innerHTML = `<span class="s-live"></span>${esc(msg)}`;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

/* Watch settings float above the video; opening them never reloads it. */
let drawerTrigger = null;
function closeWatchDrawer() {
  $('watch-drawer').hidden = true;
  $('drawer-scrim').hidden = true;
  for (const id of ['episodes-btn','sources-btn']) $(id).setAttribute('aria-expanded','false');
  drawerTrigger?.focus({preventScroll:true});
}
function openWatchDrawer(panel) {
  const drawer = $('watch-drawer');
  const trigger = $(panel === 'episodes' ? 'episodes-btn' : 'sources-btn');
  if (!drawer.hidden && drawer.dataset.panel === panel) { closeWatchDrawer(); return; }
  drawerTrigger = trigger;
  drawer.dataset.panel = panel;
  drawer.hidden = false;
  $('drawer-scrim').hidden = false;
  $('drawer-title').textContent = t(panel === 'episodes' ? 'episodes' : 'sources');
  for (const id of ['episodes-btn','sources-btn']) $(id).setAttribute('aria-expanded',String($(id) === trigger));
  $('drawer-close').focus({preventScroll:true});
}
$('episodes-btn').addEventListener('click',()=>openWatchDrawer('episodes'));
$('sources-btn').addEventListener('click',()=>openWatchDrawer('sources'));
$('drawer-close').addEventListener('click',closeWatchDrawer);
$('drawer-scrim').addEventListener('click',closeWatchDrawer);
document.addEventListener('keydown',e=>{
  if ($('watch-drawer')?.hidden !== false) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeWatchDrawer(); }
  if (e.key === 'Tab') {
    const controls=Array.from($('watch-drawer').querySelectorAll('button,select,a')).filter(el=>!el.disabled && el.getClientRects().length);
    const first=controls[0],last=controls.at(-1);
    if(e.shiftKey && document.activeElement === first) {e.preventDefault();last?.focus();}
    else if(!e.shiftKey && document.activeElement === last) {e.preventDefault();first?.focus();}
  }
});

/* ─── INIT ─── */
(async function init() {
  state = readParams();
  applyTranslations();
  if (!state) {
    $('main').innerHTML = `
      <div class="fatal">
        <h2>${esc(t('nothingTitle'))}</h2>
        <p>${esc(t('nothingDesc'))}</p>
        <a href="../index.html">${esc(t('fatalLink'))}</a>
      </div>`;
    document.title = 'TFLIX';
    return;
  }

  loadPlayer();              // start streaming immediately

  if (state.type === 'tv') await setupTv();
  else await setupMovie();
})();

/* ─── TV / D-PAD NAVIGATION ───
   Same model as the main page: arrow keys + Enter (what a TV remote sends)
   walk the page's controls — back/support buttons → season/episode →
   next episode → server cards. Activates on the first arrow key, deactivates on mouse or
   touch, so pointer users never see it. Back itself is handled outside the
   page (browser/back gesture/Android app). */
(function () {
  let active = false;
  let cur = null;

  const vis = el => !!(el && el.getClientRects().length);

  function setFocus(el, scroll = true) {
    if (!el) return;
    if (cur) cur.classList.remove('kf');
    cur = el;
    el.classList.add('kf');
    if (el.tagName === 'SELECT' || el.tagName === 'BUTTON') el.focus({ preventScroll: true });
    if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
  }

  function getSections() {
    const secs = [];
    const drawer = $('watch-drawer');
    if (drawer && !drawer.hidden) {
      const items=Array.from(drawer.querySelectorAll('button,select')).filter(el=>vis(el) && !el.disabled);
      return items.map(el=>({items:[el]}));
    }
    const header = [$('back-btn'), $('episodes-btn'), $('sources-btn'), $('lang-btn'), $('support-btn')].filter(vis);
    if (header.length) secs.push({ items: header });
    const tv = $('tv-panel');
    if (tv && !tv.hidden) {
      const sels = [$('season-select'), $('episode-select')].filter(vis);
      if (sels.length) secs.push({ items: sels });
      const next = $('nextep-btn');
      if (vis(next)) secs.push({ items: [next] });
    }
    // The player itself is a focus stop: selecting it just scrolls the video
    // to the middle of the screen (handy on a TV). It's a cross-origin iframe,
    // so we never send real focus into it — setFocus only adds the highlight
    // and scrolls; Enter on it is a harmless no-op click on the wrapper.
    const player = $('player-wrap');
    if (vis(player)) secs.push({ items: [player] });
    const retry = $('retry-source-btn');
    if (vis(retry)) secs.push({ items: [retry] });
    const cards = Array.from(document.querySelectorAll('.server-card')).filter(vis);
    const columns = Math.max(1, getComputedStyle($('server-grid')).gridTemplateColumns.split(/\s+/).length);
    for (let i = 0; i < cards.length; i += columns) secs.push({ items: cards.slice(i, i + columns) });
    return secs;
  }

  function focusInitial() {
    const sel = document.querySelector('.server-card.selected');
    if (sel && vis(sel)) { setFocus(sel); return; }
    const secs = getSections();
    if (secs.length) setFocus(secs[0].items[0]);
  }

  function move(dx, dy) {
    const secs = getSections();
    if (!secs.length) return;
    const si = secs.findIndex(s => s.items.indexOf(cur) >= 0);
    if (si < 0) { focusInitial(); return; }
    const sec = secs[si];
    const ii = sec.items.indexOf(cur);

    if (dx) {
      const ni = ii + dx;
      if (ni >= 0 && ni < sec.items.length) setFocus(sec.items[ni]);
      return;
    }
    if (dy) {
      const ns = secs[si + dy];
      if (!ns) return;
      setFocus(ns.items[Math.max(0, Math.min(ii, ns.items.length - 1))]);
    }
  }

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const k = e.key;
    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

    if (!active) {
      if (arrows[k]) {
        active = true;
        document.documentElement.classList.add('keynav');
        if (cur && vis(cur)) setFocus(cur); else focusInitial();
        e.preventDefault();
      }
      return;
    }

    if (k === 'Enter') {
      if (!cur) { focusInitial(); return; }
      if (cur.tagName === 'SELECT') {
        // Older WebViews lack showPicker — there the native Enter opens it.
        if (typeof cur.showPicker === 'function') { e.preventDefault(); try { cur.showPicker(); } catch (err) {} }
        return;
      }
      e.preventDefault();
      cur.click();
      return;
    }

    if (arrows[k]) { e.preventDefault(); move(arrows[k][0], arrows[k][1]); }
  });

  ['mousemove', 'mousedown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => {
      if (!active) return;
      active = false;
