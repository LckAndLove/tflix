name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank to use version 1.1.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build macOS Application (universal)
        if: matrix.platform == 'mac'
        run: |
          tauri build --target universal-apple-darwin
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent TFLIX.app ../dmg/tflix-mac-universal.zip
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Build Windows Application
        if: matrix.platform == 'win'
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Build Linux Application
        if: matrix.platform == 'linux'
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/dmg/*.zip
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/macos/*.tar.gz
            src-tauri/target/**/bundle/macos/*.tar.gz.sig
            src-tauri/target/**/bundle/nsis/*.zip
            src-tauri/target/**/bundle/nsis/*.zip.sig
            src-tauri/target/**/bundle/appimage/*.tar.gz
            src-tauri/target/**/bundle/appimage/*.tar.gz.sig
            src-tauri/target/**/*.sig
          if-no-files-found: error

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets
        run: node scripts/prepare-ui.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is missing in repository settings!" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.p12
          echo "Release keystore decoded successfully."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v1.3.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using release tag: ${TAG}"

      - name: Flatten and List Release Assets
        run: |
          mkdir -p release-files
          find release-assets/ -type f -exec cp -v {} release-files/ \;
          ls -lh release-files/

      - name: Generate Tauri Updater Manifest
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const tag = process.env.TAG_NAME || "v1.3.0";
          const version = tag.replace(/^v/, "");
          const repo = "LckAndLove/tflix";
          const downloadBase = `https://github.com/${repo}/releases/download/${tag}`;

          const files = fs.readdirSync("release-files");
          const platforms = {};

          files.forEach(f => {
            if (f.endsWith(".sig")) {
              const targetFile = f.slice(0, -4);
              if (files.includes(targetFile)) {
                const signature = fs.readFileSync(path.join("release-files", f), "utf8").trim();
                const url = `${downloadBase}/${encodeURIComponent(targetFile)}`;
                if (targetFile.includes(".app.tar.gz") || targetFile.includes("darwin") || targetFile.includes("macos")) {
                  platforms["darwin-aarch64"] = { signature, url };
                  platforms["darwin-x86_64"] = { signature, url };
                } else if (targetFile.includes(".nsis.zip") || targetFile.includes("x64-setup") || targetFile.includes("windows")) {
                  platforms["windows-x86_64"] = { signature, url };
                } else if (targetFile.includes(".AppImage.tar.gz") || targetFile.includes("linux") || targetFile.includes("amd64")) {
                  platforms["linux-x86_64"] = { signature, url };
                }
              }
            }
          });

          const manifest = {
            version: version,
            notes: `TFLIX ${tag} release update`,
            pub_date: new Date().toISOString(),
            platforms: platforms
          };

          fs.writeFileSync("release-files/latest.json", JSON.stringify(manifest, null, 2));
          console.log("Generated latest.json:\n", JSON.stringify(manifest, null, 2));
          '

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TFLIX ${{ steps.vars.outputs.tag }} (Tauri 2)
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
