<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="origin">
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000}body{overflow:hidden;color:#ddd;font:16px system-ui}</style>
</head><body><script src="/source-config.js"></script><script>
// A real HTTP document gives HTTPS embeds an HTTP Referer. Custom app
// protocols cannot provide one, even with referrerPolicy="origin".
try {
  const params = new URLSearchParams(location.search);
  const source = new URL(params.get('src'));
  const sourceId = Number(params.get('source'));
  const config = window.TFLIX_SOURCE_CONFIG.find(item => item.id === sourceId);
  if (!config || source.protocol !== 'https:' || source.hostname !== config.host || source.username || source.password || source.port) throw new Error('Invalid player source');
  const frame = document.createElement('iframe');
  if (config.requireReferer) frame.referrerPolicy = 'origin';
  frame.allowFullscreen = true;
  frame.allow = 'autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; web-share *';
  // Providers that reject a sandboxed ancestor are loaded without sandboxing,
  // as declared by the shared source adapter.
  if (config.sandboxEnabled) frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
  // The media monitor runs inside the provider's frame and reports to its
  // immediate parent. Forward only its typed readiness/progress signals to
  // the app so both the visible player and hidden source probes can observe
  // the real media state.
  const mediaTypes = new Set([
    'tflix:media-ready', 'tflix:media-playing', 'tflix:media-paused',
    'tflix:media-error', 'tflix:media-progress', 'tflix:media-resumed',
    'tflix:embed-blocked', 'tflix:interaction'
  ]);
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.origin !== source.origin || !mediaTypes.has(event.data?.type)) return;
    window.top.postMessage(event.data, '*');
  });
  // Resume commands originate in the app and must cross this bridge to the
  // provider frame where player_monitor can seek the matching video.
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.type !== 'tflix:resume') return;
    frame.contentWindow.postMessage(event.data, '*');
  });
  // The provider posts episode changes to its immediate wrapper. Forward only
  // this exact provider frame's validated selection, never arbitrary messages.
  window.addEventListener('message',event=>{
    if(source.hostname!=='cinesrc.st' || event.source!==frame.contentWindow || event.origin!==source.origin || event.data?.type!=='cinesrc:nextepisode')return;
    const {season,episode}=event.data;
    if(!Number.isInteger(season)||season<1||!Number.isInteger(episode)||episode<1)return;
    window.top.postMessage({type:'tflix:episode-changed',season,episode},'*');
  });
  frame.src = source.href;
  document.body.appendChild(frame);
} catch {
  document.body.textContent = '播放源地址无效 / Invalid player source';
}
// Suppress pop-up ads from the isolated provider frame.
window.open = () => null;
</script></body></html>
